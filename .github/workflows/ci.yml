# CI: runs on every push and every pull request.
# Two jobs run in parallel on fresh Linux machines. If either fails, the commit shows a red X.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (database + tests + API contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A service container: GitHub starts this throwaway Postgres next to the job and
    # deletes it afterwards. The image is Postgres with the pgvector extension included.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis
          POSTGRES_DB: trellis_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U trellis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Used by Alembic, the app code and the database tests (same value for all three).
    env:
      DATABASE_URL: postgresql://trellis:trellis@localhost:5432/trellis_test
      TEST_DATABASE_URL: postgresql://trellis:trellis@localhost:5432/trellis_test

    steps:
      - uses: actions/checkout@v4

      # uv installs Python (version from backend/.python-version) and the packages in uv.lock.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install packages (exact versions from uv.lock)
        run: uv sync --frozen

      # Build every table from the 13 migrations on an empty database. If a migration only
      # works on the developer's old Neon database, it fails here.
      - name: Apply database migrations
        run: uv run alembic upgrade head

      # TEST_DATABASE_URL is set, so the database tests run too instead of being skipped.
      # The tests fake Clerk, so no real secrets are needed.
      - name: Run tests
        run: uv run pytest -rs

      # Rebuild openapi.json from the code; fail if it differs from the committed file.
      - name: API contract is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

  # Builds the backend Docker image exactly as the host will. Nothing is pushed or run:
  # the point is that a broken Dockerfile or a missing package turns the pipeline red.
  docker:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t trellis-backend ./backend

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Placeholder values so the production build can start. Nothing here is a real key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
      FASTAPI_INTERNAL_URL: http://127.0.0.1:8000
      ARCJET_KEY: ajkey_placeholder
      UPLOADTHING_TOKEN: placeholder
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install packages (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Next.js generates some types (like RouteContext) into .next/, which a fresh
      # checkout does not have yet. Generate them first, or tsc reports errors.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
